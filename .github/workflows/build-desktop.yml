name: Build Cross-Platform Desktop Apps (macOS & Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application (.dmg / .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-terminal-desktop/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn websockets paramiko cryptography
          pip install -r ai-terminal/requirements.txt

      - name: Install Node dependencies
        run: |
          cd ai-terminal-desktop
          npm install
          cd frontend
          npm install

      - name: Build macOS Backend & App
        run: |
          cd ai-terminal-desktop
          npm run build:frontend
          mkdir -p backend-dist
          pyinstaller --noconfirm --onedir --name aiterm-backend \
            --paths backend \
            --paths ../ai-terminal \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all paramiko \
            --collect-all cryptography \
            --add-data "frontend/dist:frontend/dist" \
            --distpath backend-dist \
            backend/app.py
          npx electron-builder --mac dmg zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-macOS
          path: |
            ai-terminal-desktop/dist-electron/*.dmg
            ai-terminal-desktop/dist-electron/*.zip
          if-no-files-found: error

      - name: Publish Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-terminal-desktop/dist-electron/*.dmg
            ai-terminal-desktop/dist-electron/*.zip

  build-windows:
    name: Build Windows Application (.exe / NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-terminal-desktop/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn websockets paramiko cryptography
          pip install -r ai-terminal/requirements.txt

      - name: Install Node dependencies
        run: |
          cd ai-terminal-desktop
          npm install
          cd frontend
          npm install

      - name: Build Windows Backend & App
        shell: pwsh
        run: |
          cd ai-terminal-desktop
          npm run build:frontend
          if (-not (Test-Path "backend-dist")) { New-Item -ItemType Directory -Path "backend-dist" }
          pyinstaller --noconfirm --onedir --name aiterm-backend --paths backend --paths ../ai-terminal --collect-all uvicorn --collect-all fastapi --collect-all paramiko --collect-all cryptography --add-data "frontend/dist;frontend/dist" --distpath backend-dist backend/app.py
          npx electron-builder --win nsis portable zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Terminal-Windows
          path: |
            ai-terminal-desktop/dist-electron/*.exe
            ai-terminal-desktop/dist-electron/*.zip
          if-no-files-found: error

      - name: Publish Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-terminal-desktop/dist-electron/*.exe
            ai-terminal-desktop/dist-electron/*.zip
