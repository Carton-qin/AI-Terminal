<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Terminal - 智能终端运维工作台</title>
  </head>
  <body class="bg-[#0d1117] text-gray-200 select-none overflow-hidden antialiased">
    <div id="root"></div>
    <div id="emergency-error-container" style="display:none; position:fixed; inset:0; background:#0d1117; color:#f85149; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding:32px; z-index:999999; overflow:auto;">
      <div style="max-width:600px; margin:40px auto; background:#161b22; border:1px solid #da3633; border-radius:12px; padding:24px; box-shadow:0 16px 32px rgba(0,0,0,0.5);">
        <h2 style="font-size:18px; font-weight:600; margin:0 0 8px 0; color:#ff7b72;">⚠️ 应用程序界面加载异常</h2>
        <p style="color:#8b949e; font-size:13px; margin:0 0 16px 0;">前端资源或脚本初始化失败，可能由于缓存或网络代理拦截导致：</p>
        <pre id="emergency-error-msg" style="background:#090d13; border:1px solid #30363d; padding:12px; border-radius:6px; font-size:12px; white-space:pre-wrap; word-break:break-all; color:#ff7b72; max-height:240px; overflow-y:auto; font-family:monospace;"></pre>
        <div style="margin-top:20px; display:flex; gap:12px; justify-content:flex-end;">
          <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" style="background:#21262d; color:#c9d1d9; border:1px solid #30363d; padding:8px 16px; border-radius:6px; font-size:13px; cursor:pointer;">清空缓存并重试</button>
          <button onclick="location.reload()" style="background:#238636; color:#ffffff; border:none; padding:8px 20px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;">刷新界面</button>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          var container = document.getElementById('emergency-error-container');
          var msg = document.getElementById('emergency-error-msg');
          if (container && msg) {
            container.style.display = 'block';
            msg.textContent = (event.error && (event.error.stack || event.error.message)) || event.message || String(event);
          }
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          var container = document.getElementById('emergency-error-container');
          var msg = document.getElementById('emergency-error-msg');
          if (container && msg) {
            container.style.display = 'block';
            msg.textContent = 'Unhandled Promise Rejection:\n' + (event.reason && (event.reason.stack || event.reason.message) || String(event.reason));
          }
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
